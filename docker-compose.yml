# ═══════════════════════════════════════════════════════════════════
# CP2 — Stack chạy ở máy: agent + redis (+ nginx load balancer tùy chọn)
#
#   docker compose up -d                          # 1 agent, gọi http://localhost:8000
#   docker compose up -d --scale agent=3          # 3 agent, cổng host 8000-8002
#   docker compose --profile lb up -d --scale agent=3
#                                                 # thêm nginx round-robin ở cổng 80
#
# Secret KHÔNG nằm ở đây: ${AGENT_API_KEY} được compose đọc từ file .env.
# ═══════════════════════════════════════════════════════════════════

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  agent:
    build: .
    image: day12-agent:prod
    # Dải cổng host để --scale agent=3 không tranh nhau cổng 8000
    ports:
      - "8000-8002:8000"
    environment:
      PORT: "8000"
      AGENT_API_KEY: ${AGENT_API_KEY}
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
      MONTHLY_BUDGET_USD: ${MONTHLY_BUDGET_USD:-10.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-nvidia/nemotron-3.5-lightning:free}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).read()"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    # Cho uvicorn thời gian xử lý nốt request sau SIGTERM
    stop_grace_period: 30s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    profiles: ["lb"]
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - agent

volumes:
  redis-data:
