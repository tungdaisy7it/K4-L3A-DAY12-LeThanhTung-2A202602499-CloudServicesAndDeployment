name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (CP1-CP4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        env:
          AGENT_API_KEY: ci-dummy
          REDIS_URL: "fake://"
        # CP5 gọi bản deploy sống, bonus kiểm tra badge của chính workflow này
        # → loại ra; test build Docker thật để job build lo
        run: >
          pytest tests/ -v -m "not docker"
          --ignore=tests/test_cp5.py
          --ignore=tests/test_bonus_cicd.py

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t day12-agent:${{ github.sha }} .

      - name: Check image size and smoke test container
        run: |
          docker images day12-agent:${{ github.sha }}
          docker run -d --name agent -e AGENT_API_KEY=ci-dummy -e REDIS_URL=fake:// \
            -p 8000:8000 day12-agent:${{ github.sha }}
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 1
          done
          docker logs agent
          exit 1

  deploy:
    name: Deploy to Railway
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning::Chưa cấu hình secret RAILWAY_TOKEN — bỏ qua bước deploy"
            exit 0
          fi
          npm install -g @railway/cli
          railway up --ci --service "$RAILWAY_SERVICE"

      - name: Smoke test
        run: |
          if [ -z "$PUBLIC_URL" ]; then
            echo "::warning::Chưa cấu hình variable PUBLIC_URL — bỏ qua smoke test"
            exit 0
          fi
          sleep 45
          curl -fsS "$PUBLIC_URL/health"
          curl -fsS "$PUBLIC_URL/ready"
